<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Do'kon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/app/style.css">
</head>
<body>

<div id="screen-home" class="screen">
  <div class="topbar">
    <div class="shop-title" id="shop-title">Bizning Do'kon</div>
    <div class="shop-sub">Xush kelibsiz 👋</div>
  </div>

  <div class="section">
    <div class="section-title">Kategoriyalar</div>
    <div id="categories-row" class="categories-row"></div>
  </div>

  <div class="section">
    <div class="section-title" id="products-title">Barcha mahsulotlar</div>
    <div id="products-grid" class="products-grid"></div>
    <div id="products-empty" class="empty-state" style="display:none;">Hozircha mahsulot yo'q</div>
  </div>
</div>

<div id="screen-product" class="screen" style="display:none;">
  <div class="detail-topbar">
    <button class="icon-btn" onclick="goHome()">←</button>
    <span>Mahsulot</span>
  </div>
  <div id="product-detail"></div>
</div>

<div id="screen-cart" class="screen" style="display:none;">
  <div class="topbar">
    <div class="shop-title">🛒 Savatcha</div>
  </div>
  <div id="cart-items"></div>
  <div id="cart-empty" class="empty-state" style="display:none;">Savatchangiz bo'sh</div>
  <div id="cart-summary" class="cart-summary" style="display:none;">
    <div class="cart-total-row">
      <span>Jami</span>
      <span id="cart-total">0 so'm</span>
    </div>
    <button class="primary-btn" onclick="goCheckout()">Buyurtma berish</button>
  </div>
</div>

<div id="screen-checkout" class="screen" style="display:none;">
  <div class="detail-topbar">
    <button class="icon-btn" onclick="showScreen('cart')">←</button>
    <span>Buyurtma ma'lumotlari</span>
  </div>
  <div class="form-wrap">
    <label>Ismingiz</label>
    <input type="text" id="checkout-name" placeholder="Ismingizni kiriting">

    <label>Telefon raqam</label>
    <input type="tel" id="checkout-phone" placeholder="+998 90 123 45 67">

    <label>Yetkazib berish manzili</label>
    <textarea id="checkout-address" placeholder="Shahar, tuman, ko'cha, uy"></textarea>

    <label>Izoh (ixtiyoriy)</label>
    <textarea id="checkout-comment" placeholder="Qo'shimcha izoh"></textarea>

    <div id="checkout-error" class="error-text" style="display:none;"></div>

    <button class="primary-btn" onclick="submitOrder()">✅ Buyurtmani tasdiqlash</button>
  </div>
</div>

<div id="screen-profile" class="screen" style="display:none;">
  <div class="topbar">
    <div class="shop-title">👤 Profil</div>
  </div>
  <div id="profile-info" class="profile-card"></div>
  <div class="section-title" style="margin-top:20px;">Buyurtmalarim</div>
  <div id="profile-orders"></div>
  <div id="profile-orders-empty" class="empty-state" style="display:none;">Sizda hali buyurtmalar yo'q</div>
</div>

<div id="toast" class="toast"></div>

<div class="bottom-nav">
  <button class="nav-btn active" data-tab="home" onclick="showScreen('home')">
    <span class="nav-icon">🏠</span><span>Bosh sahifa</span>
  </button>
  <button class="nav-btn" data-tab="home" onclick="showScreen('home')">
    <span class="nav-icon">🔎</span><span>Katalog</span>
  </button>
  <button class="nav-btn" data-tab="cart" onclick="showScreen('cart')">
    <span class="nav-icon">🛒</span><span>Savat<span id="cart-badge" class="cart-badge" style="display:none;"></span></span>
  </button>
  <button class="nav-btn" data-tab="profile" onclick="showScreen('profile')">
    <span class="nav-icon">👤</span><span>Profil</span>
  </button>
</div>

<script src="/app/app.js"></script>
</body>
</html>
